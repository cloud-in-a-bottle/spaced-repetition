[app]
name = "srs"
version = "0.1.0"
description = "Spaced repetition (FSRS) that knows what each card is about, and tells other apps what you know"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 384
cpu_cores = 0.5

[data]
sqlite = ["main"]
# Offline dictionaries (built from Wiktionary data, ~120 MB per language) live here.
app_data = true

# The reader's "translate in context" uses Claude; the API key comes from the secrets app. Without it the reader
# still works, with the offline dictionary only.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [{key = "ANTHROPIC_API_KEY"}]

# Other apps ask what you know through this service; see services/srs/openapi.yaml.
[[services.v2.provides]]
service = "github.com/cloud-in-a-bottle/spaced-repetition/services/srs"
version = "0.1.0"
endpoint = "/service/"
