[project]
name = "srs"
license = "MIT"
version = "0.1.0"
description = "FSRS spaced repetition with a typed model of what each card is about"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.12",
    "hypercorn>=0.17",
    "attrs>=24.0",
    "loguru>=0.7.3",
    "fsrs>=6.3,<7",
    "jinja2>=3.1",
    "anthropic>=2.10.0",
    "lemminflect>=0.2.3",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest>=8.0",
    "pytest-playwright",
    "playwright",
    "httpx>=0.27",
    # Builds the app's Dockerfile, runs it under podman with the mounts/env its
    # openhost.toml declares, and fronts it with the real OpenHost router (real
    # subdomain routing and cookie auth). Tests hit a real, containerized app.
    # Requires podman on the host.
    "openhost[test-harness] @ git+https://github.com/cloud-in-a-bottle/cloud-in-a-bottle@main",
    "zstandard>=0.25.0",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srs"]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["."]

[tool.ruff]
line-length = 119
exclude = [
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modern Python syntax)
    "I",      # isort
    "PLC0415", # import-outside-top-level
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
known-first-party = [
    "srs",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["srs"]
strict = true
ignore_missing_imports = true
exclude = []
